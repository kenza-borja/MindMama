# Render Blueprint: deploys the AI orchestrator and the Node API together.
#
# The web app is NOT here - it is a static export that goes to Vercel or
# Netlify. See docs/DEPLOY.md.
#
# Values marked `sync: false` are not stored in this file and must be entered
# in the Render dashboard. Never commit secrets here.

services:
  - type: web
    name: mindmama-ai
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ai.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # These pins predate Python 3.13; match the version the project is
      # developed against rather than taking Render's newer default.
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      # Shared secret the Node API must present. Copy this generated value
      # into AI_API_KEY on mindmama-api below.
      - key: AI_API_KEY
        generateValue: true

  - type: web
    name: mindmama-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    # Exempt from the API key check so Render can tell the service is alive.
    healthCheckPath: /health
    envVars:
      # Render generates this once; copy it into the web app's
      # EXPO_PUBLIC_API_KEY so the two agree.
      - key: API_KEY
        generateValue: true
      # Internal URL of the AI service above.
      - key: AI_URL
        sync: false
      # Must match AI_API_KEY on mindmama-ai, or every AI call returns 401.
      - key: AI_API_KEY
        sync: false
      # The service account JSON, base64 encoded. Raw JSON loses its braces
      # or newlines in dashboard paste boxes; base64 is a single safe token.
      # Generate with: npm run encode-key -- path\to\serviceAccount.json
      - key: FIREBASE_SERVICE_ACCOUNT_B64
        sync: false
      # The deployed web app's origin, e.g. https://mindmama.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
